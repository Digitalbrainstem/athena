<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <meta name="description" content="Nexus Academy — an open-world adaptive learning game" />
  <meta name="theme-color" content="#22d3ee" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <title>Nexus Academy</title>
  <style>
    /* ------------------------------------------------------------------ */
    /* Custom properties — Style Guide                                    */
    /* ------------------------------------------------------------------ */
    :root {
      --a11y-font-size: 1rem;
      --a11y-line-spacing: 1.4;
      --frost: #22d3ee;
      --aurora: #a78bfa;
      --sunrise: #FFDAB9;
      --amber: #D4A574;
      --deep-space: #0f172a;
      --text-on-warm: #1E1B2E;
      --text-on-dark: #F5F0E8;
      --text-muted: #94A3B8;
      --error: #F97171;
      --success: #FBBF24;
      --bg-warm: linear-gradient(135deg, #FFDAB9, #87CEEB);
      --bg-dark-translucent: rgba(26, 27, 46, 0.85);
    }

    /* ------------------------------------------------------------------ */
    /* Reset                                                              */
    /* ------------------------------------------------------------------ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: var(--text-on-warm);
      font-size: var(--a11y-font-size);
      line-height: var(--a11y-line-spacing);
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    /* ------------------------------------------------------------------ */
    /* Focus indicators (WCAG 2.4.7)                                      */
    /* ------------------------------------------------------------------ */
    *:focus-visible {
      outline: 3px solid var(--frost);
      outline-offset: 2px;
    }

    /* ------------------------------------------------------------------ */
    /* Canvas                                                             */
    /* ------------------------------------------------------------------ */
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ------------------------------------------------------------------ */
    /* HUD overlay                                                        */
    /* ------------------------------------------------------------------ */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    #hud [tabindex], #hud button, #hud a {
      pointer-events: auto;
    }

    /* ------------------------------------------------------------------ */
    /* Crosshair — subtle dot                                             */
    /* ------------------------------------------------------------------ */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 3px rgba(34, 211, 238, 0.4);
    }

    /* ------------------------------------------------------------------ */
    /* Interaction prompt — Frost border, dark translucent bg              */
    /* ------------------------------------------------------------------ */
    #interaction-prompt {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.5rem 1.25rem;
      background: var(--bg-dark-translucent);
      border: 1px solid var(--frost);
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--frost);
      opacity: 0;
      transition: opacity 0.2s ease;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #interaction-prompt.visible {
      opacity: 1;
    }

    /* ------------------------------------------------------------------ */
    /* FPS counter (debug only) — Aurora colored                          */
    /* ------------------------------------------------------------------ */
    #fps-counter {
      position: absolute;
      top: 0.5rem;
      right: 0.75rem;
      font-size: 0.75rem;
      font-family: monospace;
      color: var(--aurora);
      opacity: 0.7;
    }

    /* ------------------------------------------------------------------ */
    /* Dialogue box — Aurora border, warm bg, speaker name                */
    /* ------------------------------------------------------------------ */
    #dialogue-box {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      max-width: 80vw;
      padding: 0.75rem 1.5rem;
      background: var(--bg-dark-translucent);
      border: 1px solid var(--aurora);
      border-radius: 0.5rem;
      font-size: 1.125rem;
      font-weight: 500;
      color: var(--text-on-dark);
      box-shadow: 0 0 12px rgba(167, 139, 250, 0.15);
      pointer-events: none;
    }

    /* ------------------------------------------------------------------ */
    /* Caption container                                                   */
    /* ------------------------------------------------------------------ */
    #caption-container {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      max-width: 80vw;
      pointer-events: none;
    }

    .caption-line {
      padding: 0.25rem 0.75rem;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 0.25rem;
      font-size: 0.9375rem;
      color: var(--text-on-dark);
      text-align: center;
    }

    .caption-sfx {
      font-style: italic;
      color: var(--frost);
    }

    .caption-speaker {
      font-weight: 700;
      color: var(--aurora);
    }

    /* ------------------------------------------------------------------ */
    /* Utility                                                             */
    /* ------------------------------------------------------------------ */
    .hud-hidden {
      display: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ------------------------------------------------------------------ */
        /* Old click-to-play overlay removed — portal shader handles intro */

    /* ------------------------------------------------------------------ */
    /* Reduced motion                                                      */
    /* ------------------------------------------------------------------ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    .reduced-motion *, .reduced-motion *::before, .reduced-motion *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }

    /* ------------------------------------------------------------------ */
    /* Mobile adaptations                                                  */
    /* ------------------------------------------------------------------ */
    body.mobile #crosshair {
      display: none !important;
    }

    body.mobile #dialogue-box {
      max-width: 95vw;
      font-size: 1.25rem;
      bottom: 18%;
      padding: 1rem 1.5rem;
    }

    body.mobile #interaction-prompt {
      font-size: 1rem;
      padding: 0.75rem 1.5rem;
      bottom: 28%;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body.mobile #fps-counter {
      font-size: 0.875rem;
      top: 0.75rem;
      right: 1rem;
    }

    /* ------------------------------------------------------------------ */
    /* High contrast mode                                                  */
    /* ------------------------------------------------------------------ */
    .high-contrast {
      --text-on-warm: #000;
      --text-on-dark: #fff;
      --frost: #00ffff;
      --aurora: #ff80ff;
      --text-muted: #ccc;
    }

    .high-contrast #game-canvas {
      filter: contrast(1.3) brightness(1.1);
    }

    .high-contrast #interaction-prompt,
    .high-contrast #dialogue-box {
      border-width: 3px;
      background: rgba(0, 0, 0, 0.9);
    }

    .high-contrast #start-button {
      border: 3px solid #fff;
    }

    .high-contrast .caption-line {
      background: rgba(0, 0, 0, 0.95);
      border: 1px solid #fff;
    }

    /* ------------------------------------------------------------------ */
    /* Color blind filters                                                 */
    /* ------------------------------------------------------------------ */
    .colorblind-deuteranopia #game-canvas {
      filter: url('#deuteranopia-filter');
    }
    .colorblind-protanopia #game-canvas {
      filter: url('#protanopia-filter');
    }
    .colorblind-tritanopia #game-canvas {
      filter: url('#tritanopia-filter');
    }

    /* ------------------------------------------------------------------ */
    /* Font family overrides                                               */
    /* ------------------------------------------------------------------ */
    .font-opendyslexic, .font-opendyslexic * {
      font-family: 'OpenDyslexic', sans-serif !important;
    }

    .font-high-legibility, .font-high-legibility * {
      font-family: 'Atkinson Hyperlegible', system-ui, sans-serif !important;
    }

    /* ------------------------------------------------------------------ */
    /* Profile screen overlay — immersive dark with warm glow             */
    /* ------------------------------------------------------------------ */
    #profile-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: radial-gradient(ellipse at center, rgba(255, 218, 185, 0.12) 0%, rgba(10, 10, 46, 0.95) 60%, #0a0a2e 100%);
      z-index: 30;
      padding: 1rem;
      overflow-y: auto;
      color: var(--text-on-dark);
    }

    #profile-screen h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--frost), var(--aurora));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 20px rgba(34, 211, 238, 0.3));
    }

    .profile-subtitle {
      font-size: 1.125rem;
      color: rgba(245, 240, 232, 0.6);
    }

    #profile-screen section {
      width: 100%;
      max-width: 32rem;
      text-align: center;
    }

    #profile-screen h2 {
      font-size: 1.125rem;
      margin-bottom: 0.75rem;
      color: var(--text-on-dark);
      opacity: 0.7;
    }

    /* Profile cards — warm styling on dark */
    .profile-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .profile-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      padding: 1rem 1.5rem;
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid rgba(167, 139, 250, 0.2);
      border-radius: 0.75rem;
      cursor: pointer;
      color: var(--text-on-dark);
      font-size: 1rem;
      min-width: 8rem;
      min-height: 5rem;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }

    .profile-card:hover, .profile-card:focus-visible {
      border-color: var(--frost);
      background: rgba(34, 211, 238, 0.1);
      box-shadow: 0 0 15px rgba(34, 211, 238, 0.15);
    }

    .profile-card-avatar {
      font-size: 2.5rem;
    }

    .profile-card-name {
      font-weight: 600;
    }

    /* Create form — magical dark inputs */
    .create-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      width: 100%;
      max-width: 20rem;
      text-align: left;
    }

    .form-group label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-on-dark);
      opacity: 0.7;
    }

    .form-group input,
    .form-group select {
      padding: 0.625rem 0.75rem;
      font-size: 1rem;
      font-family: 'Nunito', system-ui, sans-serif;
      border: 2px solid rgba(167, 139, 250, 0.2);
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-on-dark);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--frost);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.2);
    }

    .form-group input::placeholder {
      color: rgba(148, 163, 184, 0.5);
    }

    .form-group select option {
      background: #1a1b2e;
      color: var(--text-on-dark);
    }

    .form-help {
      font-size: 0.75rem;
      color: rgba(148, 163, 184, 0.6);
    }

    .form-error {
      font-size: 0.875rem;
      color: var(--error);
      min-height: 1.25rem;
    }

    /* Avatar picker — larger, immersive dark */
    #avatar-label {
      font-weight: 600;
      color: var(--text-on-dark);
      opacity: 0.7;
    }

    .avatar-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 0.25rem;
    }

    .avatar-option {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 4rem;
      height: 4rem;
      border: 2px solid rgba(167, 139, 250, 0.2);
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }

    .avatar-option:hover, .avatar-option:focus-visible {
      border-color: var(--aurora);
      background: rgba(167, 139, 250, 0.12);
      box-shadow: 0 0 15px rgba(167, 139, 250, 0.2);
    }

    .avatar-option.selected {
      border-color: var(--aurora);
      background: rgba(167, 139, 250, 0.15);
      box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.3), 0 0 20px rgba(167, 139, 250, 0.15);
    }

    .avatar-emoji {
      font-size: 1.75rem;
    }

    .create-btn {
      padding: 0.75rem 2rem;
      font-size: 1.125rem;
      font-weight: 700;
      font-family: 'Nunito', system-ui, sans-serif;
      color: #1E1B2E;
      background: linear-gradient(135deg, var(--frost), var(--aurora));
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      min-width: 10rem;
      min-height: 2.75rem;
      transition: opacity 0.15s, box-shadow 0.15s;
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.2);
    }

    .create-btn:hover {
      opacity: 0.9;
      box-shadow: 0 0 30px rgba(34, 211, 238, 0.35);
    }

    .create-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ------------------------------------------------------------------ */
    /* Portal screen — the gateway experience                            */
    /* ------------------------------------------------------------------ */
    #portal-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a2e;
      z-index: 40;
      overflow: hidden;
    }

    #portal-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Portal title/prompt/flash CSS removed — now rendered as GLSL shaders */

    /* ------------------------------------------------------------------ */
    /* Landscape orientation prompt                                        */
    /* ------------------------------------------------------------------ */
    #rotate-prompt {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      color: #fff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      font-family: 'Nunito', system-ui, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    #rotate-prompt .rotate-icon {
      font-size: 4rem;
      animation: rotate-nudge 2s ease-in-out infinite;
    }
    #rotate-prompt p {
      font-size: 1.25rem;
      color: var(--frost, #22d3ee);
    }
    @keyframes rotate-nudge {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-30deg); }
      75% { transform: rotate(30deg); }
    }
    @media (orientation: portrait) {
      #rotate-prompt { display: flex; }
    }
    @media (orientation: landscape) {
      #rotate-prompt { display: none !important; }
    }

    /* ------------------------------------------------------------------ */
    /* Companion picker — 3D previews with descriptions                   */
    /* ------------------------------------------------------------------ */
    .companion-picker-group {
      max-width: 100% !important;
    }

    .companion-picker-group .avatar-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      max-width: 36rem;
      margin: 0.25rem auto 0;
    }

    .companion-picker-group .avatar-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      width: auto;
      height: auto;
      padding: 0.75rem 0.5rem;
      min-height: 8rem;
    }

    .companion-preview-canvas {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      pointer-events: none;
    }

    .profile-bg-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    #profile-screen > *:not(.profile-bg-canvas) {
      position: relative;
      z-index: 1;
    }

    .companion-name {
      font-weight: 700;
      font-size: 0.875rem;
      color: var(--text-on-dark);
    }

    .companion-desc {
      font-size: 0.7rem;
      color: rgba(148, 163, 184, 0.7);
      text-align: center;
      line-height: 1.2;
      max-width: 10rem;
    }

    .avatar-option.greeting {
      border-color: var(--aurora);
      background: rgba(167, 139, 250, 0.12);
      box-shadow: 0 0 15px rgba(167, 139, 250, 0.2);
    }

    @media (max-width: 480px) {
      .companion-picker-group .avatar-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* ------------------------------------------------------------------ */
    /* Quest panel — Frost/Aurora accents, warm translucent background     */
    /* ------------------------------------------------------------------ */
    #quest-panel {
      position: absolute;
      top: 1rem;
      left: 1rem;
      max-width: 22rem;
      padding: 0.75rem 1rem;
      background: var(--bg-dark-translucent);
      border: 1px solid var(--frost);
      border-radius: 0.5rem;
      color: var(--text-on-dark);
      opacity: 0;
      transform: translateY(-0.5rem);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }

    #quest-panel.quest-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .quest-title {
      font-size: 0.9375rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, var(--frost), var(--aurora));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quest-step {
      font-size: 0.8125rem;
      font-weight: 400;
      color: var(--text-on-dark);
      margin-bottom: 0.25rem;
      line-height: 1.4;
    }

    .quest-progress {
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .quest-hint {
      font-size: 0.75rem;
      font-style: italic;
      color: var(--aurora);
      margin-top: 0.375rem;
      min-height: 1rem;
    }

    .quest-complete-flash {
      animation: questCompleteGlow 1.5s ease-out;
    }

    @keyframes questCompleteGlow {
      0% { border-color: var(--success); box-shadow: 0 0 16px rgba(251, 191, 36, 0.4); }
      100% { border-color: var(--frost); box-shadow: none; }
    }

    /* Quest indicator dot on interactable objects (shown via HUD overlay) */
    .quest-indicator {
      position: absolute;
      bottom: 22%;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.375rem 1rem;
      background: var(--bg-dark-translucent);
      border: 1px solid var(--aurora);
      border-radius: 0.5rem;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--aurora);
      opacity: 0;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }

    .quest-indicator.visible {
      opacity: 1;
    }

    /* Mobile quest panel */
    body.mobile #quest-panel {
      max-width: 60vw;
      font-size: 1rem;
      top: 0.75rem;
      left: 0.75rem;
    }

    body.mobile .quest-title { font-size: 1rem; }
    body.mobile .quest-step { font-size: 0.9375rem; }

    /* ------------------------------------------------------------------ */
    /* Panel shared — hidden state                                         */
    /* ------------------------------------------------------------------ */
    .panel-hidden {
      display: none !important;
    }

    /* ------------------------------------------------------------------ */
    /* Crafting Panel — Amber/Frost accents, warm translucent background   */
    /* ------------------------------------------------------------------ */
    #craft-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90vw;
      max-width: 32rem;
      max-height: 85vh;
      background: var(--bg-dark-translucent);
      border: 1px solid var(--amber);
      border-radius: 0.75rem;
      color: var(--text-on-dark);
      box-shadow: 0 0 20px rgba(212, 165, 116, 0.15);
      z-index: 15;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .craft-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(212, 165, 116, 0.2);
    }

    .craft-title {
      font-size: clamp(1.125rem, 3vw, 1.5rem);
      font-weight: 700;
      color: var(--amber);
      margin: 0;
    }

    .craft-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      min-width: 2.75rem;
      min-height: 2.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .craft-close:hover,
    .craft-close:focus-visible {
      color: var(--text-on-dark);
      background: rgba(255, 255, 255, 0.1);
    }

    .craft-body {
      padding: 0.75rem 1rem;
      overflow-y: auto;
      flex: 1;
    }

    .craft-ingredients {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      min-height: 2.5rem;
    }

    .craft-ingredient {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.5rem 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 0.5rem;
      color: var(--text-on-dark);
      cursor: pointer;
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 0.875rem;
      min-height: 2.75rem;
      transition: border-color 0.15s, background 0.15s;
    }

    .craft-ingredient:hover,
    .craft-ingredient:focus-visible {
      border-color: var(--frost);
      background: rgba(34, 211, 238, 0.1);
    }

    .craft-ingredient-name {
      font-weight: 500;
    }

    .craft-ingredient-qty {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .craft-empty {
      color: var(--text-muted);
      font-size: 0.875rem;
      font-style: italic;
      padding: 0.5rem 0;
    }

    .craft-slots {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.75rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 0.5rem;
      min-height: 3rem;
      margin-bottom: 0.75rem;
    }

    .craft-slots-hint {
      color: var(--text-muted);
      font-size: 0.8rem;
      font-style: italic;
      margin: 0;
    }

    .craft-slot {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.375rem 0.5rem;
      background: rgba(167, 139, 250, 0.12);
      border: 1px solid var(--aurora);
      border-radius: 0.375rem;
      font-size: 0.875rem;
    }

    .craft-slot-name {
      font-weight: 500;
    }

    .craft-slot-qty {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .craft-slot-remove {
      background: none;
      border: none;
      color: var(--error);
      cursor: pointer;
      font-size: 1rem;
      padding: 0 0.25rem;
      margin-left: 0.25rem;
      min-width: 1.5rem;
      min-height: 1.5rem;
    }

    .craft-slot-remove:hover,
    .craft-slot-remove:focus-visible {
      color: #fff;
      background: rgba(249, 113, 113, 0.3);
      border-radius: 0.25rem;
    }

    .craft-formula {
      font-size: 0.9375rem;
      color: var(--frost);
      text-align: center;
      padding: 0.25rem 0;
      min-height: 1.5rem;
      letter-spacing: 0.02em;
    }

    .craft-result {
      text-align: center;
      padding: 0.5rem 0;
      min-height: 2rem;
    }

    .craft-result-text {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-on-dark);
    }

    .craft-success .craft-result-text {
      color: var(--success);
    }

    .craft-failure .craft-result-text {
      color: var(--error);
    }

    .craft-actions {
      padding: 0.75rem 1rem;
      border-top: 1px solid rgba(212, 165, 116, 0.2);
      text-align: center;
    }

    .craft-btn {
      padding: 0.625rem 2rem;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Nunito', system-ui, sans-serif;
      color: var(--text-on-warm);
      background: linear-gradient(135deg, var(--frost), var(--aurora));
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      min-width: 8rem;
      min-height: 2.75rem;
      transition: opacity 0.15s;
    }

    .craft-btn:hover {
      opacity: 0.9;
    }

    .craft-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ------------------------------------------------------------------ */
    /* Map Panel — Deep Space background, Frost node connections           */
    /* ------------------------------------------------------------------ */
    #map-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 92vw;
      max-width: 36rem;
      max-height: 88vh;
      background: var(--bg-dark-translucent);
      border: 1px solid var(--frost);
      border-radius: 0.75rem;
      color: var(--text-on-dark);
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.12);
      z-index: 15;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .map-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(34, 211, 238, 0.2);
    }

    .map-title {
      font-size: clamp(1.125rem, 3vw, 1.5rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--frost), var(--aurora));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
    }

    .map-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      min-width: 2.75rem;
      min-height: 2.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .map-close:hover,
    .map-close:focus-visible {
      color: var(--text-on-dark);
      background: rgba(255, 255, 255, 0.1);
    }

    .map-body {
      padding: 0.5rem 1rem;
      overflow-y: auto;
      flex: 1;
    }

    .map-canvas {
      width: 100%;
      height: auto;
      max-height: 280px;
      border-radius: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .map-biomes {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }

    .map-biome-node {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.5rem 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0.5rem;
      color: var(--text-on-dark);
      cursor: pointer;
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 0.8125rem;
      min-height: 2.5rem;
      transition: border-color 0.15s, background 0.15s;
    }

    .map-biome-node.map-discovered:hover,
    .map-biome-node.map-discovered:focus-visible {
      border-color: var(--frost);
      background: rgba(34, 211, 238, 0.1);
    }

    .map-biome-node.map-current {
      border-color: var(--frost);
      background: rgba(34, 211, 238, 0.12);
    }

    .map-biome-node.map-undiscovered {
      opacity: 0.45;
      cursor: default;
    }

    .map-node-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .map-node-unknown {
      background: var(--text-muted) !important;
    }

    .map-node-name {
      font-weight: 500;
    }

    .map-node-badge {
      font-size: 0.7rem;
      color: var(--frost);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .map-hint {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      padding: 0.5rem 1rem 0.75rem;
      margin: 0;
    }

    /* ------------------------------------------------------------------ */
    /* High contrast overrides for panels                                   */
    /* ------------------------------------------------------------------ */
    .high-contrast #craft-panel,
    .high-contrast #map-panel {
      background: rgba(0, 0, 0, 0.95);
      border-width: 3px;
    }

    .high-contrast .craft-ingredient,
    .high-contrast .map-biome-node {
      border-width: 2px;
    }

    /* ------------------------------------------------------------------ */
    /* Mobile overrides for panels                                          */
    /* ------------------------------------------------------------------ */
    body.mobile #craft-panel,
    body.mobile #map-panel {
      width: 96vw;
      max-height: 90vh;
    }

    body.mobile .craft-ingredient,
    body.mobile .map-biome-node {
      min-height: 3rem;
      font-size: 1rem;
    }

    body.mobile .craft-btn {
      min-height: 3rem;
      font-size: 1.125rem;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas" aria-label="Nexus Academy game viewport" role="img"></canvas>

  <!-- SVG color-blind simulation filters -->
  <svg class="sr-only" aria-hidden="true">
    <defs>
      <filter id="deuteranopia-filter">
        <feColorMatrix type="matrix" values="0.625 0.375 0 0 0  0.7 0.3 0 0 0  0 0.3 0.7 0 0  0 0 0 1 0" />
      </filter>
      <filter id="protanopia-filter">
        <feColorMatrix type="matrix" values="0.567 0.433 0 0 0  0.558 0.442 0 0 0  0 0.242 0.758 0 0  0 0 0 1 0" />
      </filter>
      <filter id="tritanopia-filter">
        <feColorMatrix type="matrix" values="0.95 0.05 0 0 0  0 0.433 0.567 0 0  0 0.475 0.525 0 0  0 0 0 1 0" />
      </filter>
    </defs>
  </svg>

  <nav id="hud" aria-label="Game heads-up display">
    <div id="crosshair" aria-hidden="true"></div>

    <!-- Quest panel — shows active quest title, current step, hints -->
    <div id="quest-panel" role="region" aria-label="Active quest">
      <h3 class="quest-title"></h3>
      <p class="quest-step"></p>
      <p class="quest-progress"></p>
      <p class="quest-hint" aria-live="polite"></p>
    </div>

    <!-- Quest indicator — subtle prompt near quest-relevant objects -->
    <p id="quest-indicator" class="quest-indicator" role="status" aria-live="polite"></p>

    <p id="interaction-prompt" role="status" aria-live="polite" aria-label="">Press E to interact</p>
    <p id="fps-counter" aria-hidden="true" class="hud-hidden">-- FPS</p>
    <div id="dialogue-box" class="hud-hidden" role="log" aria-live="polite" aria-label="Companion dialogue"></div>
    <div id="caption-container" aria-label="Captions" role="log" aria-live="off"></div>
  </nav>

  <!-- Screen-reader announcements (visually hidden, read by AT) -->
  <div id="a11y-announcer-polite" class="sr-only" aria-live="polite" aria-atomic="true" role="status"></div>
  <div id="a11y-announcer-assertive" class="sr-only" aria-live="assertive" aria-atomic="true" role="alert"></div>

  <!-- Portal screen replaces old click-to-play — rendered by portal-screen.ts -->

  <!-- Landscape orientation prompt -->
  <div id="rotate-prompt" role="alert" aria-label="Please rotate your device to landscape">
    <span class="rotate-icon" aria-hidden="true">📱</span>
    <p>Please rotate your device to landscape</p>
  </div>

  <script type="module" src="src/main.ts"></script>
</body>
</html>
