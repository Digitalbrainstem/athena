<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <meta name="description" content="Nexus Academy — an open-world adaptive learning game" />
  <meta name="theme-color" content="#22d3ee" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <title>Nexus Academy</title>
  <style>
    /* ------------------------------------------------------------------ */
    /* Custom properties — Style Guide                                    */
    /* ------------------------------------------------------------------ */
    :root {
      --a11y-font-size: 1rem;
      --a11y-line-spacing: 1.4;
      --frost: #22d3ee;
      --aurora: #a78bfa;
      --sunrise: #FFDAB9;
      --amber: #D4A574;
      --deep-space: #0f172a;
      --text-on-warm: #1E1B2E;
      --text-on-dark: #F5F0E8;
      --text-muted: #94A3B8;
      --error: #F97171;
      --success: #FBBF24;
      --bg-warm: linear-gradient(135deg, #FFDAB9, #87CEEB);
      --bg-dark-translucent: rgba(26, 27, 46, 0.85);
    }

    /* ------------------------------------------------------------------ */
    /* Reset                                                              */
    /* ------------------------------------------------------------------ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-warm);
      font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: var(--text-on-warm);
      font-size: var(--a11y-font-size);
      line-height: var(--a11y-line-spacing);
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    /* ------------------------------------------------------------------ */
    /* Focus indicators (WCAG 2.4.7)                                      */
    /* ------------------------------------------------------------------ */
    *:focus-visible {
      outline: 3px solid var(--frost);
      outline-offset: 2px;
    }

    /* ------------------------------------------------------------------ */
    /* Canvas                                                             */
    /* ------------------------------------------------------------------ */
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ------------------------------------------------------------------ */
    /* HUD overlay                                                        */
    /* ------------------------------------------------------------------ */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    #hud [tabindex], #hud button, #hud a {
      pointer-events: auto;
    }

    /* ------------------------------------------------------------------ */
    /* Crosshair — subtle dot                                             */
    /* ------------------------------------------------------------------ */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 3px rgba(34, 211, 238, 0.4);
    }

    /* ------------------------------------------------------------------ */
    /* Interaction prompt — Frost border, dark translucent bg              */
    /* ------------------------------------------------------------------ */
    #interaction-prompt {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.5rem 1.25rem;
      background: var(--bg-dark-translucent);
      border: 1px solid var(--frost);
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--frost);
      opacity: 0;
      transition: opacity 0.2s ease;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #interaction-prompt.visible {
      opacity: 1;
    }

    /* ------------------------------------------------------------------ */
    /* FPS counter (debug only) — Aurora colored                          */
    /* ------------------------------------------------------------------ */
    #fps-counter {
      position: absolute;
      top: 0.5rem;
      right: 0.75rem;
      font-size: 0.75rem;
      font-family: monospace;
      color: var(--aurora);
      opacity: 0.7;
    }

    /* ------------------------------------------------------------------ */
    /* Dialogue box — Aurora border, warm bg, speaker name                */
    /* ------------------------------------------------------------------ */
    #dialogue-box {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      max-width: 80vw;
      padding: 0.75rem 1.5rem;
      background: var(--bg-dark-translucent);
      border: 1px solid var(--aurora);
      border-radius: 0.5rem;
      font-size: 1.125rem;
      font-weight: 500;
      color: var(--text-on-dark);
      box-shadow: 0 0 12px rgba(167, 139, 250, 0.15);
    }

    /* ------------------------------------------------------------------ */
    /* Caption container                                                   */
    /* ------------------------------------------------------------------ */
    #caption-container {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      max-width: 80vw;
      pointer-events: none;
    }

    .caption-line {
      padding: 0.25rem 0.75rem;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 0.25rem;
      font-size: 0.9375rem;
      color: var(--text-on-dark);
      text-align: center;
    }

    .caption-sfx {
      font-style: italic;
      color: var(--frost);
    }

    .caption-speaker {
      font-weight: 700;
      color: var(--aurora);
    }

    /* ------------------------------------------------------------------ */
    /* Utility                                                             */
    /* ------------------------------------------------------------------ */
    .hud-hidden {
      display: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ------------------------------------------------------------------ */
    /* Click-to-play overlay — warm gradient                              */
    /* ------------------------------------------------------------------ */
    #click-to-play {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-warm);
      z-index: 20;
    }

    #click-to-play h1 {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--frost), var(--aurora));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }

    #click-to-play p {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    #start-button {
      padding: 0.75rem 2rem;
      font-size: 1.125rem;
      font-weight: 600;
      font-family: 'Nunito', system-ui, sans-serif;
      color: var(--text-on-warm);
      background: linear-gradient(135deg, var(--frost), var(--aurora));
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      min-width: 5rem;
      min-height: 2.75rem;
    }

    #start-button:hover {
      opacity: 0.9;
    }

    #click-to-play.hidden {
      display: none;
    }

    /* ------------------------------------------------------------------ */
    /* Reduced motion                                                      */
    /* ------------------------------------------------------------------ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    .reduced-motion *, .reduced-motion *::before, .reduced-motion *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }

    /* ------------------------------------------------------------------ */
    /* Mobile adaptations                                                  */
    /* ------------------------------------------------------------------ */
    body.mobile #crosshair {
      display: none !important;
    }

    body.mobile #dialogue-box {
      max-width: 95vw;
      font-size: 1.25rem;
      bottom: 18%;
      padding: 1rem 1.5rem;
    }

    body.mobile #interaction-prompt {
      font-size: 1rem;
      padding: 0.75rem 1.5rem;
      bottom: 28%;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body.mobile #fps-counter {
      font-size: 0.875rem;
      top: 0.75rem;
      right: 1rem;
    }

    /* ------------------------------------------------------------------ */
    /* High contrast mode                                                  */
    /* ------------------------------------------------------------------ */
    .high-contrast {
      --text-on-warm: #000;
      --text-on-dark: #fff;
      --frost: #00ffff;
      --aurora: #ff80ff;
      --text-muted: #ccc;
    }

    .high-contrast #game-canvas {
      filter: contrast(1.3) brightness(1.1);
    }

    .high-contrast #interaction-prompt,
    .high-contrast #dialogue-box {
      border-width: 3px;
      background: rgba(0, 0, 0, 0.9);
    }

    .high-contrast #start-button {
      border: 3px solid #fff;
    }

    .high-contrast .caption-line {
      background: rgba(0, 0, 0, 0.95);
      border: 1px solid #fff;
    }

    /* ------------------------------------------------------------------ */
    /* Color blind filters                                                 */
    /* ------------------------------------------------------------------ */
    .colorblind-deuteranopia #game-canvas {
      filter: url('#deuteranopia-filter');
    }
    .colorblind-protanopia #game-canvas {
      filter: url('#protanopia-filter');
    }
    .colorblind-tritanopia #game-canvas {
      filter: url('#tritanopia-filter');
    }

    /* ------------------------------------------------------------------ */
    /* Font family overrides                                               */
    /* ------------------------------------------------------------------ */
    .font-opendyslexic, .font-opendyslexic * {
      font-family: 'OpenDyslexic', sans-serif !important;
    }

    .font-high-legibility, .font-high-legibility * {
      font-family: 'Atkinson Hyperlegible', system-ui, sans-serif !important;
    }

    /* ------------------------------------------------------------------ */
    /* Profile screen overlay — warm sunrise gradient                     */
    /* ------------------------------------------------------------------ */
    #profile-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: var(--bg-warm);
      z-index: 30;
      padding: 1rem;
      overflow-y: auto;
      color: var(--text-on-warm);
    }

    #profile-screen h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--frost), var(--aurora));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .profile-subtitle {
      font-size: 1.125rem;
      color: var(--text-muted);
    }

    #profile-screen section {
      width: 100%;
      max-width: 32rem;
      text-align: center;
    }

    #profile-screen h2 {
      font-size: 1.125rem;
      margin-bottom: 0.75rem;
      color: var(--text-on-warm);
      opacity: 0.7;
    }

    /* Profile cards — warm styling */
    .profile-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .profile-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      padding: 1rem 1.5rem;
      background: rgba(255, 255, 255, 0.3);
      border: 2px solid rgba(30, 27, 46, 0.15);
      border-radius: 0.75rem;
      cursor: pointer;
      color: var(--text-on-warm);
      font-size: 1rem;
      min-width: 8rem;
      min-height: 5rem;
      transition: border-color 0.15s, background 0.15s;
    }

    .profile-card:hover, .profile-card:focus-visible {
      border-color: var(--frost);
      background: rgba(34, 211, 238, 0.15);
    }

    .profile-card-avatar {
      font-size: 2.5rem;
    }

    .profile-card-name {
      font-weight: 600;
    }

    /* Create form — warm inputs */
    .create-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      width: 100%;
      max-width: 20rem;
      text-align: left;
    }

    .form-group label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-on-warm);
      opacity: 0.7;
    }

    .form-group input,
    .form-group select {
      padding: 0.625rem 0.75rem;
      font-size: 1rem;
      font-family: 'Nunito', system-ui, sans-serif;
      border: 2px solid rgba(30, 27, 46, 0.15);
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.5);
      color: var(--text-on-warm);
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--frost);
    }

    .form-group input::placeholder {
      color: var(--text-muted);
    }

    .form-help {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .form-error {
      font-size: 0.875rem;
      color: var(--error);
      min-height: 1.25rem;
    }

    /* Avatar picker — larger, warmer */
    #avatar-label {
      font-weight: 600;
      color: var(--text-on-warm);
      opacity: 0.7;
    }

    .avatar-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 0.25rem;
    }

    .avatar-option {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 4rem;
      height: 4rem;
      border: 2px solid rgba(30, 27, 46, 0.15);
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .avatar-option:hover, .avatar-option:focus-visible {
      border-color: var(--aurora);
      background: rgba(167, 139, 250, 0.15);
    }

    .avatar-option.selected {
      border-color: var(--aurora);
      background: rgba(167, 139, 250, 0.2);
      box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.3);
    }

    .avatar-emoji {
      font-size: 1.75rem;
    }

    .create-btn {
      padding: 0.75rem 2rem;
      font-size: 1.125rem;
      font-weight: 700;
      font-family: 'Nunito', system-ui, sans-serif;
      color: var(--text-on-warm);
      background: linear-gradient(135deg, var(--frost), var(--aurora));
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      min-width: 10rem;
      min-height: 2.75rem;
      transition: opacity 0.15s;
    }

    .create-btn:hover {
      opacity: 0.9;
    }

    .create-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas" aria-label="Nexus Academy game viewport" role="img"></canvas>

  <!-- SVG color-blind simulation filters -->
  <svg class="sr-only" aria-hidden="true">
    <defs>
      <filter id="deuteranopia-filter">
        <feColorMatrix type="matrix" values="0.625 0.375 0 0 0  0.7 0.3 0 0 0  0 0.3 0.7 0 0  0 0 0 1 0" />
      </filter>
      <filter id="protanopia-filter">
        <feColorMatrix type="matrix" values="0.567 0.433 0 0 0  0.558 0.442 0 0 0  0 0.242 0.758 0 0  0 0 0 1 0" />
      </filter>
      <filter id="tritanopia-filter">
        <feColorMatrix type="matrix" values="0.95 0.05 0 0 0  0 0.433 0.567 0 0  0 0.475 0.525 0 0  0 0 0 1 0" />
      </filter>
    </defs>
  </svg>

  <nav id="hud" aria-label="Game heads-up display">
    <div id="crosshair" aria-hidden="true"></div>
    <p id="interaction-prompt" role="status" aria-live="polite" aria-label="">Press E to interact</p>
    <p id="fps-counter" aria-hidden="true" class="hud-hidden">-- FPS</p>
    <div id="dialogue-box" class="hud-hidden" role="log" aria-live="polite" aria-label="Companion dialogue"></div>
    <div id="caption-container" aria-label="Captions" role="log" aria-live="off"></div>
  </nav>

  <!-- Screen-reader announcements (visually hidden, read by AT) -->
  <div id="a11y-announcer-polite" class="sr-only" aria-live="polite" aria-atomic="true" role="status"></div>
  <div id="a11y-announcer-assertive" class="sr-only" aria-live="assertive" aria-atomic="true" role="alert"></div>

  <main id="click-to-play" aria-label="Game start screen">
    <h1>Nexus Academy</h1>
    <p>An open-world adaptive learning game</p>
    <button id="start-button" type="button" aria-label="Start the game. Click or press Enter to enter the Workshop.">
      Enter the Workshop
    </button>
  </main>

  <script type="module" src="src/main.ts"></script>
</body>
</html>
