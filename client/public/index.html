<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="description" content="Nexus Academy — an open-world adaptive learning game" />
  <meta name="theme-color" content="#0a0a1a" />
  <title>Nexus Academy</title>
  <style>
    /* ------------------------------------------------------------------ */
    /* Reset                                                              */
    /* ------------------------------------------------------------------ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a1a;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #e2e8f0;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    /* ------------------------------------------------------------------ */
    /* Canvas                                                             */
    /* ------------------------------------------------------------------ */
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ------------------------------------------------------------------ */
    /* HUD overlay (pointer-events: none so clicks pass to canvas)        */
    /* ------------------------------------------------------------------ */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* ------------------------------------------------------------------ */
    /* Crosshair                                                          */
    /* ------------------------------------------------------------------ */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 4px rgba(34, 211, 238, 0.6);
    }

    /* ------------------------------------------------------------------ */
    /* Interaction prompt                                                  */
    /* ------------------------------------------------------------------ */
    #interaction-prompt {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 20px;
      background: rgba(10, 10, 26, 0.75);
      border: 1px solid #22d3ee;
      border-radius: 8px;
      font-size: 0.875rem;
      color: #22d3ee;
      opacity: 0;
      transition: opacity 0.2s ease;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #interaction-prompt.visible {
      opacity: 1;
    }

    /* ------------------------------------------------------------------ */
    /* FPS counter (debug only)                                           */
    /* ------------------------------------------------------------------ */
    #fps-counter {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 0.75rem;
      font-family: monospace;
      color: #a78bfa;
      opacity: 0.7;
    }

    /* ------------------------------------------------------------------ */
    /* Utility class to hide HUD elements                                 */
    /* ------------------------------------------------------------------ */
    .hud-hidden {
      display: none !important;
    }

    /* ------------------------------------------------------------------ */
    /* Click-to-play overlay                                              */
    /* ------------------------------------------------------------------ */
    #click-to-play {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 26, 0.85);
      z-index: 20;
      cursor: pointer;
    }

    #click-to-play h1 {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      background: linear-gradient(135deg, #22d3ee, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }

    #click-to-play p {
      font-size: 1rem;
      color: #94a3b8;
    }

    #click-to-play.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas" aria-label="Nexus Academy game viewport" role="img"></canvas>

  <div id="hud" role="status" aria-live="polite">
    <div id="crosshair" aria-hidden="true"></div>
    <div id="interaction-prompt" aria-label="" role="alert">Press E to interact</div>
    <div id="fps-counter" aria-hidden="true" class="hud-hidden">-- FPS</div>
  </div>

  <div id="click-to-play" role="button" tabindex="0" aria-label="Click or press Enter to start the game">
    <h1>Nexus Academy</h1>
    <p>Click to enter the Workshop</p>
  </div>

  <script type="module" src="../src/main.ts"></script>
</body>
</html>
